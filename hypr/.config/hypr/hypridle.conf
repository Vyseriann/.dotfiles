# Example of an idle timer for locking after inactivity (e.g., 5 minutes)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
}

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid launching multiple instances
    before_sleep_cmd = loginctl lock-session    # Lock the session before sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn monitors on after waking
}

# Handle keyboard backlight resume
listener {
    timeout = 10                                 # A dummy placeholder timeout
    on-timeout = true                            # Required syntax for hypridle
    on-resume = brightnessctl -d "*::kbd_backlight" set 100%
}
